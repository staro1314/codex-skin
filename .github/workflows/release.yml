name: Release Candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate and build"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Bind candidate to the event commit
        shell: bash
        run: |
          set -euo pipefail
          event_sha="$(git rev-parse HEAD)"
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$event_sha" = "${{ github.sha }}"
          test "$release_sha" = "${{ github.sha }}"
          node tools/release-doctor.mjs --tag "$RELEASE_TAG"
          node tools/sync-runtime-assets.mjs --check
          node --test tools/*.test.mjs

  windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build Windows installer
        shell: pwsh
        run: .\windows\installer\build-release.ps1 -OutputDirectory .\release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-dream-skin-windows
          path: release/*
          if-no-files-found: error

  release-handoff:
    needs: [guard, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
      - name: Summarize release candidates
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 3 -type f -print
          printf 'Candidate %s built from %s. Publish remains an explicit human-approved step.\n' "$RELEASE_TAG" "${{ github.sha }}"
